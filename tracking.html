<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TachatzCoPilot – מעקב אירועים</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #dfe5ee;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --success: #166534;
      --success-bg: #dcfce7;
      --warning: #92400e;
      --warning-bg: #fef3c7;
      --danger: #b42318;
      --danger-bg: #fee4e2;
      --purple: #7c3aed;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 24px;
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 23px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
      font-size: 14px;
    }

    main {
      width: min(1180px, calc(100% - 30px));
      margin: 24px auto;
    }

    .toolbar,
    .summary,
    .event-card,
    .empty-state {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(16, 24, 40, 0.05);
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 15px 17px;
      margin-bottom: 16px;
    }

    .toolbar-actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 10px 15px;
      color: white;
      background: var(--accent);
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--accent-dark); }
    button.secondary { background: #475467; }
    button.secondary:hover { background: #344054; }
    button.success {
      background: #2563eb;
    }
    
    button.success:hover {
      background: #1d4ed8;
    }
    
    button.danger {
      background: #374151;
    }
    
    button.danger:hover {
      background: #1f2937;
    }018; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 1px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .summary-item {
      padding: 14px;
      background: #fff;
      text-align: center;
    }

    .summary-item strong {
      display: block;
      margin-bottom: 4px;
      font-size: 24px;
    }

    .events-list {
      display: grid;
      gap: 14px;
    }

    .event-card {
      padding: 17px;
      border-right-width: 7px;
    }

    .event-card.normal { border-right-color: #22c55e; }
    .event-card.warning {
      border-right-color: #f59e0b;
      background: #fffdf5;
    }
    .event-card.overdue {
      border-right-color: #dc2626;
      background: #fff8f7;
    }
    .event-card.closed {
      border-right-color: #94a3b8;
      opacity: 0.82;
    }

    .event-card-header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
    }

    .event-title {
      margin: 0;
      font-size: 19px;
      line-height: 1.45;
    }

    .operator-badge {
      display: inline-flex;
      flex-shrink: 0;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-weight: 700;
      white-space: nowrap;
    }

    .countdown-box {
      margin-top: 13px;
      padding: 13px 14px;
      border-radius: 11px;
      background: #f8fafc;
      border: 1px solid var(--line);
    }

    .countdown-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .countdown {
      font-size: 27px;
      font-weight: 800;
      direction: ltr;
      text-align: right;
      letter-spacing: 1px;
    }

    .countdown-label,
    .countdown {
      font-family: "Segoe UI", Arial, sans-serif;
    }


        .countdown {
      direction: rtl;
      text-align: right;
    }
    
    .countdown-number {
      direction: ltr;
      unicode-bidi: isolate;
      display: inline-block;
    }
    
    .event-card.warning .countdown { color: var(--warning); }
    .event-card.overdue .countdown { color: var(--danger); }

    .planned-end-warning {
      margin-top: 9px;
      color: var(--danger);
      font-weight: 700;
    }



    .event-actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    
        .set-end-panel {
      display: none;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f8fafc;
    }
    
    .set-end-panel.show {
      display: flex;
    }
    
    .set-end-panel input {
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }

    .empty-state {
      padding: 35px 20px;
      text-align: center;
      color: var(--muted);
    }

    .section-title {
      margin: 24px 0 10px;
      font-size: 18px;
    }

    .hidden { display: none !important; }

    @media (max-width: 850px) {
      .summary { grid-template-columns: repeat(2, 1fr); }
      .event-meta { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 560px) {
      .event-card-header { flex-direction: column; }
      .event-meta { grid-template-columns: 1fr; }
      .toolbar { align-items: stretch; }
      .toolbar-actions { flex-direction: column; }
      .toolbar-actions button { width: 100%; }
      .summary { grid-template-columns: 1fr 1fr; }
      .event-actions { flex-direction: column; }
      .event-actions button { width: 100%; }
    }
  
  .operator-logo-badge {
    min-width: 74px;
    min-height: 38px;
    padding: 5px 10px;
    background: #f8fafc;
    border: 1px solid var(--line);
  }
  
  .operator-logo-badge img {
    display: block;
    width: 100%;
    max-width: 82px;
    height: 28px;
    object-fit: contain;
  }

    
  </style>
</head>
<body>
<header>
  <h1>TachatzCoPilot – מעקב אירועים</h1>
  <p>בדיקה מחזורית של אירועי זמן אמת עד לסגירתם</p>
</header>

<main>
  <section class="toolbar">
    <div>
      <strong>האירועים מסודרים לפי זמן הבדיקה הקרוב ביותר.</strong>
      <div id="readStatus" class="status">טוען אירועים...</div>
    </div>

    <div class="toolbar-actions">
      <button id="refreshBtn" type="button" class="secondary">רענן</button>
      <button id="toggleClosedBtn" type="button" class="secondary">
        הצג אירועים סגורים
      </button>
    </div>
  </section>

  <section class="summary">
    <div class="summary-item">
      <strong id="openCount">0</strong>
      אירועים פתוחים
    </div>
    <div class="summary-item">
      <strong id="overdueCount">0</strong>
      דורשים בדיקה
    </div>
    <div class="summary-item">
      <strong id="soonCount">0</strong>
      עד 10 דקות
    </div>
    <div class="summary-item">
      <strong id="worksCount">0</strong>
      עבודות
    </div>
  </section>

  <div id="activeEventsList" class="events-list"></div>

  <div id="activeEmpty" class="empty-state hidden">
    אין כרגע אירועים פתוחים במעקב.
  </div>

  <section id="closedSection" class="hidden">
    <h2 class="section-title">אירועים סגורים</h2>
    <div id="closedEventsList" class="events-list"></div>
    <div id="closedEmpty" class="empty-state hidden">
      אין אירועים סגורים להצגה.
    </div>
  </section>
</main>

<script>
  const FIREBASE_DATABASE_URL =
    'https://tachatz-copilot-default-rtdb.europe-west1.firebasedatabase.app/';

  const RECORD_PATH = 'tachatz-followup/events';
  const AUTO_REFRESH_MS = 5000;
  const COUNTDOWN_REFRESH_MS = 1000;
  const WARNING_WINDOW_MS = 10 * 60 * 1000;

  const OPERATOR_LOGOS = {
    'אגד': 'logos/egged.jpg',
    'אפיקים': 'logos/afikim.png',
    'דן': 'logos/dan.png',
    'מטרופולין': 'logos/metropoline.svg',
    'סופרבוס': 'logos/superbus.png',
    'קווים': 'logos/kavim.svg'
  };

  let eventsById = {};
  let showClosed = false;
  let actionInProgress = new Set();
  let openSetEndEventId = null;

  const el = id => document.getElementById(id);

  function collectionEndpoint() {
    return FIREBASE_DATABASE_URL.replace(/\/+$/, '') +
      '/' + RECORD_PATH + '.json';
  }

  function eventEndpoint(eventId) {
    return FIREBASE_DATABASE_URL.replace(/\/+$/, '') +
      '/' + RECORD_PATH + '/' +
      encodeURIComponent(eventId) + '.json';
  }

  function parseDate(value) {
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? null : date;
  }

  function formatIsraelDateTime(value) {
    const date = parseDate(value);
    if (!date) return '—';

    return new Intl.DateTimeFormat('he-IL', {
      dateStyle: 'short',
      timeStyle: 'short',
      timeZone: 'Asia/Jerusalem'
    }).format(date);
  }

function formatTimeInputValue(value) {
  const date = parseDate(value);

  if (!date) {
    return '';
  }

  return (
    String(date.getHours()).padStart(2, '0') +
    ':' +
    String(date.getMinutes()).padStart(2, '0')
  );
}
  
  function getReviewIntervalMinutes(record) {
    const stored = Number(record.review_interval_minutes);

    if (Number.isFinite(stored) && stored > 0) {
      return stored;
    }

    return record.event_type === 'עבודות' ? 120 : 60;
  }

  function getEventVisualState(record) {
  if (record.status === 'closed') return 'closed';

  const effectiveDeadline =
    getEffectiveDeadline(record);

  if (!effectiveDeadline) {
    return 'overdue';
  }

  const remaining =
    effectiveDeadline.getTime() - Date.now();

  if (remaining <= 0) return 'overdue';
  if (remaining <= WARNING_WINDOW_MS) return 'warning';

  return 'normal';
}

  function formatDuration(milliseconds) {
    const absolute = Math.abs(milliseconds);
    const totalSeconds = Math.floor(absolute / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    return [
      String(hours).padStart(2, '0'),
      String(minutes).padStart(2, '0'),
      String(seconds).padStart(2, '0')
    ].join(':');
  }
  
function countdownText(record) {
  const effectiveDeadline =
    getEffectiveDeadline(record);

  if (!effectiveDeadline) {
    return 'לא הוגדר מועד';
  }

  const deadlineType =
    getDeadlineType(record);

  const remaining =
    effectiveDeadline.getTime() - Date.now();

  if (remaining <= 0) {
  return formatDuration(remaining);
}

  return formatDuration(remaining);
}

  function escapeHtml(value) {
    return String(value ?? '').replace(
      /[&<>'"]/g,
      char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[char])
    );
  }

  function sortedRecords(status) {
    return Object.values(eventsById || {})
      .filter(record => (record.status || 'open') === status)
      .sort((a, b) => {
        if (status === 'closed') {
          const aTime = parseDate(a.closed_at)?.getTime() || 0;
          const bTime = parseDate(b.closed_at)?.getTime() || 0;
          return bTime - aTime;
        }

            const priorityOrder = {
      overdue: 0,
      warning: 1,
      normal: 2
    };

    const aState = getEventVisualState(a);
    const bState = getEventVisualState(b);
    
    const priorityDifference =
      priorityOrder[aState] - priorityOrder[bState];
    
    if (priorityDifference !== 0) {
      return priorityDifference;
    }
    
    const aDeadline =
      getEffectiveDeadline(a)?.getTime() || 0;
    
    const bDeadline =
      getEffectiveDeadline(b)?.getTime() || 0;
    
    return aDeadline - bDeadline;
      });
  }

  function buildEventCard(record) {
    const card = document.createElement('article');
    const visualState = getEventVisualState(record);
    const eventId = record.id || '';

    card.className = `event-card ${visualState}`;
    card.dataset.eventId = eventId;

    const plannedEnd = parseDate(record.planned_end_at);
    const plannedEndPassed =
      record.status !== 'closed' &&
      plannedEnd &&
      plannedEnd.getTime() <= Date.now();
    
    const operatorLogo =
      OPERATOR_LOGOS[record.operator] || '';
    
    const operatorDisplay = operatorLogo
      ? `
        <span
          class="operator-badge operator-logo-badge"
          title="${escapeHtml(record.operator || '')}"
        >
          <img
            src="${escapeHtml(operatorLogo)}"
            alt="${escapeHtml(record.operator || '')}"
          />
        </span>
      `
      : `
        <span class="operator-badge">
          ${escapeHtml(record.operator || 'לא צוין')}
        </span>
      `;

    
    card.innerHTML = `
      <div class="event-card-header">
        <h2 class="event-title">${escapeHtml(record.title || 'ללא כותרת')}</h2>
        ${operatorDisplay}
      </div>

${
  record.status === 'closed'
    ? `
      <div class="countdown-box">
        <div class="countdown-label">האירוע נסגר</div>

        <div style="font-weight:700;">
          ${escapeHtml(
            formatIsraelDateTime(record.closed_at)
          )}
        </div>
      </div>
    `
    : `
      <div class="countdown-box">
        <div
          class="countdown"
          data-countdown-for="${escapeHtml(eventId)}"
        >
          ${escapeHtml(countdownText(record))}
        </div>
      </div>

      ${
        plannedEndPassed
          ? `
            <div class="planned-end-warning">
              האירוע עבר את שעת הסיום המשוערת.
            </div>
          `
          : ''
      }

      <div class="event-actions">
        <button
          type="button"
          class="success"
          data-action="updated"
          data-event-id="${escapeHtml(eventId)}"
        >
          התקבל עדכון
        </button>

        <button
          type="button"
          class="secondary"
          data-action="set-end"
          data-event-id="${escapeHtml(eventId)}"
        >
          קבע שעת סיום
        </button>

        <button
          type="button"
          class="danger"
          data-action="close"
          data-event-id="${escapeHtml(eventId)}"
        >
          סגור אירוע
        </button>
      </div>

      <div
        class="set-end-panel"
        data-set-end-panel="${escapeHtml(eventId)}"
      >
        <input
          type="time"
          class="planned-end-time-input"
          data-set-end-input="${escapeHtml(eventId)}"
          value="${formatTimeInputValue(record.planned_end_at)}"
        />

        <button
          type="button"
          data-action="save-end"
          data-event-id="${escapeHtml(eventId)}"
        >
          שמור
        </button>

        <button
          type="button"
          class="secondary"
          data-action="cancel-end"
          data-event-id="${escapeHtml(eventId)}"
        >
          ביטול
        </button>
      </div>
    `
}
    `;

    return card;
  }

function getReviewIntervalMinutes(record) {
  const stored = Number(record.review_interval_minutes);

  if (Number.isFinite(stored) && stored > 0) {
    return stored;
  }

  return record.event_type === 'עבודות' ? 120 : 60;
}

  function getEffectiveDeadline(record) {
  const plannedEnd =
    parseDate(record.planned_end_at);

  const nextReview =
    parseDate(record.next_review_at);

  return plannedEnd || nextReview;
}

function getDeadlineType(record) {
  const nextReview = parseDate(record.next_review_at);
  const plannedEnd = parseDate(record.planned_end_at);

  if (!plannedEnd) return 'review';
  if (!nextReview) return 'planned-end';

  return plannedEnd.getTime() <= nextReview.getTime()
    ? 'planned-end'
    : 'review';
}
  
  function render() {
    const openRecords = sortedRecords('open');
    const closedRecords = sortedRecords('closed');

    el('activeEventsList').innerHTML = '';
    el('closedEventsList').innerHTML = '';

    openRecords.forEach(record => {
      el('activeEventsList').appendChild(
        buildEventCard(record)
      );
    });

    closedRecords.forEach(record => {
      el('closedEventsList').appendChild(
        buildEventCard(record)
      );
    });

    el('activeEmpty').classList.toggle(
      'hidden',
      openRecords.length > 0
    );

    el('closedEmpty').classList.toggle(
      'hidden',
      closedRecords.length > 0
    );

    const overdue = openRecords.filter(
      record => getEventVisualState(record) === 'overdue'
    ).length;

    const soon = openRecords.filter(
      record => getEventVisualState(record) === 'warning'
    ).length;

    const works = openRecords.filter(
      record => record.event_type === 'עבודות'
    ).length;

    el('openCount').textContent = openRecords.length;
    el('overdueCount').textContent = overdue;
    el('soonCount').textContent = soon;
    el('worksCount').textContent = works;

    bindActionButtons();
    updateCountdowns();
  }

  function updateCountdowns() {
    document
      .querySelectorAll('[data-countdown-for]')
      .forEach(element => {
        const eventId = element.dataset.countdownFor;
        const record = eventsById[eventId];

        if (!record) return;

        const card = element.closest('.event-card');
        const visualState = getEventVisualState(record);

        card.classList.remove(
          'normal',
          'warning',
          'overdue'
        );
        card.classList.add(visualState);

        element.textContent = countdownText(record);
      });

    updateSummaryWithoutFullRender();
  }

  function updateSummaryWithoutFullRender() {
    const openRecords = sortedRecords('open');

    el('overdueCount').textContent =
      openRecords.filter(
        record => getEventVisualState(record) === 'overdue'
      ).length;

    el('soonCount').textContent =
      openRecords.filter(
        record => getEventVisualState(record) === 'warning'
      ).length;
  }

  function setActionButtonsDisabled(eventId, disabled) {
    document
      .querySelectorAll(
        `[data-event-id="${CSS.escape(eventId)}"]`
      )
      .forEach(button => {
        button.disabled = disabled;
      });
  }

  async function patchEvent(eventId, values) {
    const response = await fetch(
      eventEndpoint(eventId),
      {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(values)
      }
    );

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
  }

  async function markUpdated(eventId) {
    const record = eventsById[eventId];
    if (!record || actionInProgress.has(eventId)) return;

    actionInProgress.add(eventId);
    setActionButtonsDisabled(eventId, true);

    const now = new Date();
    const intervalMinutes =
      getReviewIntervalMinutes(record);

    try {
          const newDeadline = new Date(
      now.getTime() +
      intervalMinutes * 60 * 1000
    );
    
    const values = {
      last_update_at: now.toISOString(),
      next_review_at: newDeadline.toISOString(),
      planned_end_at: newDeadline.toISOString(),
      planned_end_manually_set: false
    };
    
    if (!record.planned_end_manually_set) {
      values.planned_end_at =
        newDeadline.toISOString();
    }
      await patchEvent(eventId, values);
      Object.assign(record, values);

      el('readStatus').textContent =
        `הבדיקה הבאה נדחתה ב-${
          intervalMinutes === 120
            ? 'שעתיים'
            : 'שעה'
        }.`;

      render();
    } catch (error) {
      el('readStatus').textContent =
        `לא ניתן לעדכן את האירוע: ${error.message}`;
    } finally {
      actionInProgress.delete(eventId);
      setActionButtonsDisabled(eventId, false);
    }
  }

function toggleSetEndPanel(eventId, show) {
  openSetEndEventId = show ? eventId : null;

  document
    .querySelectorAll('.set-end-panel')
    .forEach(panel => panel.classList.remove('show'));

  if (!show) {
    return;
  }

  const panel = document.querySelector(
    `[data-set-end-panel="${CSS.escape(eventId)}"]`
  );

  if (panel) {
    panel.classList.add('show');
  }
}

async function savePlannedEnd(eventId) {
  const record = eventsById[eventId];

  if (!record || actionInProgress.has(eventId)) {
    return;
  }

  const input = document.querySelector(
    `[data-set-end-input="${CSS.escape(eventId)}"]`
  );

  if (!input) return;

  const [hours, minutes] =
  input.value.split(':').map(Number);

const selectedEnd = new Date();

selectedEnd.setHours(
  hours,
  minutes,
  0,
  0
);

// If the selected time has already passed today,
// assume the operator means tomorrow.
if (selectedEnd <= new Date()) {
  selectedEnd.setDate(
    selectedEnd.getDate() + 1
  );
}

  actionInProgress.add(eventId);
  setActionButtonsDisabled(eventId, true);

  try {
    const values = {
      planned_end_at: selectedEnd.toISOString(),
      planned_end_manually_set: true
    };

    await patchEvent(eventId, values);
    Object.assign(record, values);
    openSetEndEventId = null;

    el('readStatus').textContent =
      'שעת הסיום עודכנה.';

    render();
  } catch (error) {
    el('readStatus').textContent =
      `לא ניתן לעדכן את שעת הסיום: ${error.message}`;
  } finally {
    actionInProgress.delete(eventId);
    setActionButtonsDisabled(eventId, false);
  }
}
  
  async function closeEvent(eventId) {
    const record = eventsById[eventId];
    if (!record || actionInProgress.has(eventId)) return;

    const confirmed = confirm(
      'לסגור את האירוע ולהעביר אותו לרשימת האירועים הסגורים?'
    );

    if (!confirmed) return;

    actionInProgress.add(eventId);
    setActionButtonsDisabled(eventId, true);

    try {
      const values = {
        status: 'closed',
        closed_at: new Date().toISOString()
      };

      await patchEvent(eventId, values);
      Object.assign(record, values);

      el('readStatus').textContent = 'האירוע נסגר.';
      render();
    } catch (error) {
      el('readStatus').textContent =
        `לא ניתן לסגור את האירוע: ${error.message}`;
    } finally {
      actionInProgress.delete(eventId);
      setActionButtonsDisabled(eventId, false);
    }
  }


function enablePlannedEndWheel(input) {
  input.addEventListener(
    'wheel',
    event => {
      event.preventDefault();

      const value = input.value || '00:00';
      let [hours, minutes] = value
        .split(':')
        .map(Number);

      let totalMinutes = hours * 60 + minutes;

      // Shift = hours, normal wheel = minutes
      const step = event.shiftKey ? 60 : 1;

      totalMinutes +=
        event.deltaY < 0 ? step : -step;

      totalMinutes =
        (totalMinutes + 1440) % 1440;

      hours = Math.floor(totalMinutes / 60);
      minutes = totalMinutes % 60;

      input.value =
        String(hours).padStart(2, '0') +
        ':' +
        String(minutes).padStart(2, '0');
    },
    { passive: false }
  );
}
  
  function bindActionButtons() {
    document
      .querySelectorAll('[data-action="set-end"]')
      .forEach(button => {
        button.addEventListener('click', () => {
          toggleSetEndPanel(
            button.dataset.eventId,
            true
          );
        });
      });
    
    document
      .querySelectorAll('[data-action="save-end"]')
      .forEach(button => {
        button.addEventListener('click', () => {
          savePlannedEnd(button.dataset.eventId);
        });
      });
    
    document
      .querySelectorAll('[data-action="cancel-end"]')
      .forEach(button => {
        button.addEventListener('click', () => {
          toggleSetEndPanel(
            button.dataset.eventId,
            false
          );
        });
      });
      
    document
      .querySelectorAll('[data-action="updated"]')
      .forEach(button => {
        button.addEventListener('click', () => {
          markUpdated(button.dataset.eventId);
        });
      });

    document
      .querySelectorAll('[data-action="close"]')
      .forEach(button => {
        button.addEventListener('click', () => {
          closeEvent(button.dataset.eventId);
        });
      });

    document
  .querySelectorAll('.planned-end-time-input')
  .forEach(input => {
    enablePlannedEndWheel(input);
  });
  }

  async function loadEvents(showLoading = false) {
    if (showLoading) {
      el('readStatus').textContent = 'טוען אירועים...';
    }

    try {
      const response = await fetch(
        collectionEndpoint(),
        {
          method: 'GET',
          cache: 'no-store'
        }
      );

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const raw = await response.json();
      eventsById = raw || {};

      Object.entries(eventsById).forEach(
        ([key, record]) => {
          if (!record.id) record.id = key;
          if (!record.status) record.status = 'open';
        }
      );

      render();

      el('readStatus').textContent =
        `עודכן לאחרונה: ${new Intl.DateTimeFormat(
          'he-IL',
          {
            timeStyle: 'medium',
            timeZone: 'Asia/Jerusalem'
          }
        ).format(new Date())}`;
    } catch (error) {
      el('readStatus').textContent =
        `לא ניתן לקרוא את האירועים: ${error.message}`;
    }
  }

  el('refreshBtn').addEventListener(
    'click',
    () => loadEvents(true)
  );

  el('toggleClosedBtn').addEventListener(
    'click',
    () => {
      showClosed = !showClosed;

      el('closedSection').classList.toggle(
        'hidden',
        !showClosed
      );

      el('toggleClosedBtn').textContent =
        showClosed
          ? 'הסתר אירועים סגורים'
          : 'הצג אירועים סגורים';
    }
  );

  loadEvents(true);
  setInterval(() => {
  // Don't rebuild the cards while the operator
  // is editing a planned end time.
  if (openSetEndEventId) {
    return;
  }

    loadEvents(false);
  }, AUTO_REFRESH_MS);
  setInterval(updateCountdowns, COUNTDOWN_REFRESH_MS);
</script>
</body>
</html>
